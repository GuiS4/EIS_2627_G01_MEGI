<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CourierFlow</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- TOP HEADER -->
    <header class="top-header">

        <a href="index.html" class="logo">
            Courier<span>Flow</span>
        </a>

        <div class="header-actions">
            <a href="index.html" class="btn btn-outline">Home</a>
            <a href="register.html" class="btn btn-primary">Register</a>
        </div>

    </header>


    <!-- LOGIN CONTENT -->
    <main class="auth-main">

        <section class="auth-container">

            <div class="auth-card">

                <div class="auth-heading">
                    <p class="tag">WELCOME BACK</p>

                    <h1>Login to CourierFlow</h1>

                    <p>
                        Enter your credentials to access your account.
                    </p>
                </div>


                <form id="loginForm" novalidate>

                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                        >

                        <span class="error-message" id="emailError"></span>
                    </div>


                    <div class="form-group">
                        <label for="password">Password</label>

                        <div class="password-input-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                            >
                            <button
                                type="button"
                                id="togglePassword"
                                class="password-toggle-btn"
                                aria-label="Show password"
                                title="Show password"
                            >
                                <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>

                        <span class="error-message" id="passwordError"></span>
                    </div>


                    <div class="form-options">

                        <label class="remember">
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">Forgot password?</a>

                    </div>


                    <button type="submit"
                            class="btn btn-primary auth-button">
                        Login
                    </button>

                </form>


                <div class="auth-footer">

                    <p>
                        Don't have an account?
                        <a href="register.html">Create an account</a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="js/main.js"></script>

</body>
</html>
